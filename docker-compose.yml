# Optional containerized dependencies. The default local workflow uses the
# host Postgres and host Ollama (see README), so this file is not required.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lead
      POSTGRES_PASSWORD: lead_dev_password
      POSTGRES_DB: lead_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead -d lead_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
